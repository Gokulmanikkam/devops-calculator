
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple modern calculator built as a DevOps learning project.">
    <title>DevOps Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <span class="project-tag">MY DEVOPS PROJECT</span>
            <h1>Smart Calculator</h1>
            <p>A simple calculator built for learning DevOps.</p>
        </header>

        <section class="calculator" aria-label="Calculator">
            <div class="display">
                <div id="previous" class="previous" aria-live="polite"></div>
                <output id="display" class="current" aria-live="polite">0</output>
            </div>
<p>DevOps CI/CD automation test - v2</p>
            <div class="keys">
                <button class="key utility" data-action="clear">AC</button>
                <button class="key utility" data-action="delete" aria-label="Delete last digit">DEL</button>
                <button class="key utility" data-action="sign">+/-</button>
                <button class="key operator" data-operator="/" aria-label="Divide">÷</button>

                <button class="key" data-number="7">7</button>
                <button class="key" data-number="8">8</button>
                <button class="key" data-number="9">9</button>
                <button class="key operator" data-operator="*" aria-label="Multiply">×</button>

                <button class="key" data-number="4">4</button>
                <button class="key" data-number="5">5</button>
                <button class="key" data-number="6">6</button>
                <button class="key operator" data-operator="-" aria-label="Subtract">−</button>

                <button class="key" data-number="1">1</button>
                <button class="key" data-number="2">2</button>
                <button class="key" data-number="3">3</button>
                <button class="key operator" data-operator="+" aria-label="Add">+</button>

                <button class="key utility" data-action="sign">+/-</button>
                <button class="key" data-number="0">0</button>
                <button class="key" data-action="decimal">.</button>
                <button class="key equals" data-action="equals">=</button>
            </div>

            <p id="message" class="message" role="status"></p>
        </section>

        <footer>
            <span>Built with HTML, CSS &amp; JavaScript</span>
            <span>Learning DevOps, one step at a time 🚀</span>
        </footer>
    </main>
</body>
</html>
